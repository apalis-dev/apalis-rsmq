[package]
name = "apalis-rsmq"
version = "0.1.0-alpha.1"
edition = "2024"
repository = "https://github.com/apalis-dev/apalis-rsmq"
authors = ["Njuguna Mureithi <mureithinjuguna@gmail.com>"]
description = "A redis-backed message queue build with rust, apalis and rsmq-async"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["redis", "task", "message-queue", "worker"]
categories = ["database"]

[dependencies]
apalis-core = { version = "1.0.0-alpha.2", features = ["json", "sleep"] }
rsmq_async = "13.0.0"
futures = "0.3"
serde = "1"
tracing = { version = "0.1.41" }
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1.0"
pin-project-lite = "0.2"

[dev-dependencies]
apalis = { version = "1.0.0-alpha.2" }
tokio = { version = "1", features = ["full"] }
tracing-subscriber = "0.3"
apalis-workflow = { version = "0.1.0-alpha.2" }
