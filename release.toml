# cargo-release configuration

# Use semantic versioning
sign-commit = false
sign-tag = false
push-remote = "origin"
shared-version = true

# Pre-release checks
pre-release-replacements = [
    {file="README.md", search="apalis-rsmq = \"[^\"]+\"", replace="apalis-rsmq = \"{{version}}\""},
    {file="src/lib.rs", search="html_root_url = \"[^\"]+\"", replace="html_root_url = \"https://docs.rs/apalis-rsmq/{{version}}\"", exactly=1},
]

# Post-release actions
post-release-replacements = []

# What to do after tagging and before pushing
pre-release-hook = ["cargo", "test", "--all-features"]

# Customization of the commit messages
tag-message = "chore: release v{{version}}"
tag-name = "v{{version}}"

# Don't publish pre-releases to crates.io automatically
publish = false

[[pre-release-replacements]]
file = "CHANGELOG.md"
search = "## Unreleased"
replace = "## Unreleased\n\n## [{{version}}] - {{date}}"