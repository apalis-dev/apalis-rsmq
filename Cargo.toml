[package]
name = "apalis-rsmq"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/apalis-dev/apalis-rsmq"
authors = ["Njuguna Mureithi <mureithinjuguna@gmail.com>"]
description = "A redis-backed message queue build with rust, apalis and rsmq-async"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["redis", "task", "message-queue", "worker"]
categories = ["database"]

[dependencies]
apalis-core = { version = "1.0.0-rc.11", features = ["sleep"] }
apalis-codec = { version = "0.1.0-rc.11", features = ["json"] }
futures = "0.3"
serde = "1"
tracing = { version = "0.1.44" }
serde_json = "1.0"
pin-project-lite = "0.2"
redis = { version = "1.7.1", default-features = false, features = [
    "script",
    "aio",
    "connection-manager",
    "tokio-comp",
] }
rand = "0.10"
thiserror = "2"

[dev-dependencies]
apalis = { version = "1.0.0-rc.11" }
tokio = { version = "1", features = ["full"] }
tracing-subscriber = "0.3"
apalis-workflow = { version = "0.1.0-rc.11" }
rsmq_async = "18.0.0"
